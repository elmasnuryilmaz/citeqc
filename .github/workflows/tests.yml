name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # the anndata extra is installed everywhere so the .h5mu reader is tested
      - run: python -m pip install -e '.[test,anndata]'
      - run: python -m pytest -q
      - name: Quick start runs end to end
        run: python examples/quickstart.py

  minimum-versions:
    # the oldest releases pyproject.toml claims to support
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.23.*" "pandas==1.5.*" "scipy==1.10.*" -e '.[test]'
      - run: python -m pytest -q

  package:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/citeqc --version
          /tmp/clean/bin/citeqc example ex
          /tmp/clean/bin/citeqc couple --adt ex/adt.csv --rna ex/rna.csv --meta ex/meta.csv \
            --normalise --out ex/coupling.csv
          /tmp/clean/bin/citeqc map --query cd45
